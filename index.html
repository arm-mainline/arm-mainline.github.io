<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniTube - Video Platformu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. BÖLÜM: YAŞ VE T.C. DOĞRULAMA EKRANI -->
    <div id="authGate" class="gate-body">
        <div class="gate-card">
            <div class="logo-title">🎥 MiniTube</div>
            <h2>🔒 Yaş ve Kimlik Doğrulaması</h2>
            <p>Bu platforma yalnızca <strong>15 yaş altı</strong> kullanıcılar erişebilir.</p>
            
            <div class="input-group">
                <label for="tcNo">T.C. Kimlik Numarası:</label>
                <input type="text" id="tcNo" maxlength="11" placeholder="11 Haneli T.C. No">
            </div>

            <div class="input-group">
                <label for="birthYear">Doğum Yılı:</label>
                <input type="number" id="birthYear" placeholder="Örn: 2014" min="2000" max="2026">
            </div>
            
            <button onclick="verifyUser()">Doğrula ve Giriş Yap</button>
            <p id="errorMsg" class="error"></p>
        </div>
    </div>

    <!-- 2. BÖLÜM: VİDEO PLATFORMU VE OTOMATİK YÜKLEME EKRANI -->
    <div id="videoPlatform" style="display: none;">
        <header class="navbar">
            <div class="logo">🎥 MiniTube <span class="badge">15-</span></div>
            <div class="nav-right">
                <button class="action-btn" onclick="openUploadModal()">➕ Video Yükle</button>
                <button class="logout-btn" onclick="logout()">Çıkış Yap</button>
            </div>
        </header>

        <main class="container">
            <h2 class="section-title">Platform Videoları</h2>
            <div class="video-grid" id="videoGrid">
                <!-- Videolar buraya yüklenecek -->
            </div>
        </main>

        <!-- VİDEO YÜKLEME MODALI -->
        <div id="uploadModal" class="modal" style="display: none;">
            <div class="modal-content">
                <h3>📤 Bilgisayardan Video Yükle</h3>
                <p>Videonu seç ve yükle butonuna bas (Otomatik yüklenecek):</p>
                
                <div class="input-group">
                    <label>Video Başlığı:</label>
                    <input type="text" id="videoTitle" placeholder="Örn: Arduino Projem">
                </div>

                <div class="input-group">
                    <label>Video Dosyası (.mp4):</label>
                    <input type="file" id="videoFile" accept="video/mp4" style="color: #fff; border:none; padding: 5px 0;">
                </div>

                <p id="uploadStatus" style="font-size: 12px; color: #ffcc00; margin-top: 5px;"></p>

                <div class="modal-buttons">
                    <button onclick="uploadVideoAutomatically()" class="save-btn" id="uploadBtn">Yükle</button>
                    <button onclick="closeUploadModal()" class="cancel-btn">İptal</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        window.onload = function() {
            if (localStorage.getItem('isVerified') === 'true') {
                showPlatform();
                loadVideos();
            }
        };

        // T.C. Algoritma Kontrolü
        function validateTCKN(tc) {
            if (tc.length !== 11 || tc[0] === '0' || isNaN(tc)) return false;
            let digits = tc.split('').map(Number);
            let sumOdd = digits[0] + digits[2] + digits[4] + digits[6] + digits[8];
            let sumEven = digits[1] + digits[3] + digits[5] + digits[7];
            let d10 = ((sumOdd * 7) - sumEven) % 10;
            if (d10 < 0) d10 += 10;
            let d11 = (digits.slice(0, 10).reduce((a, b) => a + b, 0)) % 10;
            return digits[9] === d10 && digits[10] === d11;
        }

        function verifyUser() {
            const tc = document.getElementById('tcNo').value.trim();
            const birthYearInput = document.getElementById('birthYear').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.textContent = "";

            if (!tc || !birthYearInput) {
                errorMsg.textContent = "Lütfen tüm alanları doldurun!";
                return;
            }

            if (!validateTCKN(tc)) {
                errorMsg.textContent = "Hata: Geçersiz T.C. Kimlik Numarası!";
                return;
            }

            const birthYear = parseInt(birthYearInput);
            const currentYear = new Date().getFullYear();
            const age = currentYear - birthYear;

            if (age >= 0 && age < 15) {
                localStorage.setItem('isVerified', 'true');
                showPlatform();
                loadVideos();
            } else if (age >= 15) {
                errorMsg.textContent = "Erişim Reddedildi: Platform yalnızca 15 yaş altı içindir.";
            } else {
                errorMsg.textContent = "Lütfen geçerli bir doğum yılı girin.";
            }
        }

        function showPlatform() {
            document.getElementById('authGate').style.display = 'none';
            document.getElementById('videoPlatform').style.display = 'block';
        }

        function logout() {
            localStorage.removeItem('isVerified');
            location.reload();
        }

        // --- VİDEO YÖNETİMİ VE OTOMATİK YÜKLEME ---
        function loadVideos() {
            const grid = document.getElementById('videoGrid');
            grid.innerHTML = '';

            let defaultVideos = [
                { title: "Örnek Proje: Büyük Tavşan", url: "https://archive.org/download/BigBuckBunny_124/Content/big_buck_bunny_720p_surround.mp4" }
            ];

            let savedVideos = JSON.parse(localStorage.getItem('myCustomVideos')) || defaultVideos;

            savedVideos.forEach(video => {
                const card = document.createElement('div');
                card.className = 'video-card';
                card.innerHTML = `
                    <div class="video-wrapper-archive">
                        <video controls width="100%">
                            <source src="${video.url}" type="video/mp4">
                            Tarayıcınız video etiketini desteklemiyor.
                        </video>
                    </div>
                    <div class="video-info">
                        <h3>${video.title}</h3>
                        <p>Kendi Sunucumuz • Yeni</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function openUploadModal() {
            document.getElementById('uploadModal').style.display = 'flex';
        }

        function closeUploadModal() {
            document.getElementById('uploadModal').style.display = 'none';
            document.getElementById('uploadStatus').textContent = '';
        }

        // Otomatik Dosya Yükleme Fonksiyonu (Catbox API kullanarak)
        async function uploadVideoAutomatically() {
            const title = document.getElementById('videoTitle').value.trim();
            const fileInput = document.getElementById('videoFile');
            const statusText = document.getElementById('uploadStatus');
            const uploadBtn = document.getElementById('uploadBtn');

            if (!title || fileInput.files.length === 0) {
                alert("Lütfen bir başlık yazın ve video dosyası seçin!");
                return;
            }

            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append('reqtype', 'fileupload');
            formData.append('fileToUpload', file);

            uploadBtn.disabled = true;
            statusText.textContent = "Video yükleniyor, lütfen bekleyin...";

            try {
                // Anonim dosya yükleme API'sine istek atıyoruz
                const response = await fetch('https://catbox.moe/user/api.php', {
                    method: 'POST',
                    body: formData
                });

                const videoUrl = await response.text();

                if (videoUrl.startsWith('http')) {
                    // Başarıyla yüklendi, localStorage'a kaydedelim
                    let savedVideos = JSON.parse(localStorage.getItem('myCustomVideos')) || [
                        { title: "Örnek Proje: Büyük Tavşan", url: "https://archive.org/download/BigBuckBunny_124/Content/big_buck_bunny_720p_surround.mp4" }
                    ];

                    savedVideos.unshift({ title: title, url: videoUrl.trim() });
                    localStorage.setItem('myCustomVideos', JSON.stringify(savedVideos));

                    alert("Video başarıyla yüklendi ve eklendi!");
                    document.getElementById('videoTitle').value = '';
                    fileInput.value = '';
                    closeUploadModal();
                    loadVideos();
                } else {
                    statusText.textContent = "Yükleme başarısız oldu. Tekrar deneyin.";
                }
            } catch (error) {
                statusText.textContent = "Bir hata oluştu: " + error.message;
            } finally {
                uploadBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
