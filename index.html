<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniTube - 15 Yaş Altı Platformu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. BÖLÜM: YAŞ DOĞRULAMA EKRANI (Başlangıçta görünür) -->
    <div id="authGate" class="gate-body">
        <div class="gate-card">
            <div class="logo-title">🎥 MiniTube</div>
            <h2>🔒 Yaş ve Kimlik Doğrulaması</h2>
            <p>Bu platforma yalnızca <strong>15 yaş altı</strong> kullanıcılar T.C. doğrulaması ile erişebilir.</p>
            
            <div class="input-group">
                <label for="tcNo">T.C. Kimlik Numarası:</label>
                <input type="text" id="tcNo" maxlength="11" placeholder="11 Haneli T.C. No">
            </div>

            <div class="input-group">
                <label for="birthYear">Doğum Yılı:</label>
                <input type="number" id="birthYear" placeholder="Örn: 2014" min="2000" max="2026">
            </div>
            
            <button onclick="verifyUser()">Doğrula ve Giriş Yap</button>
            <p id="errorMsg" class="error"></p>
        </div>
    </div>

    <!-- 2. BÖLÜM: VİDEO PLATFORMU (Başlangıçta gizlidir) -->
    <div id="videoPlatform" style="display: none;">
        <header class="navbar">
            <div class="logo">🎥 MiniTube <span class="badge">15-</span></div>
            <button class="logout-btn" onclick="logout()">Güvenli Çıkış</button>
        </header>

        <main class="container">
            <h2 class="section-title">Öne Çıkan Videolar</h2>
            <div class="video-grid">
                
                <!-- Video 1 -->
                <div class="video-card">
                    <div class="video-wrapper">
                        <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="Video 1" allowfullscreen></iframe>
                    </div>
                    <div class="video-info">
                        <h3>Yazılım ve Kodlama Eğitimi #1</h3>
                        <p>Teknoloji Kanalı • 1.2 B görüntüleme</p>
                    </div>
                </div>

                <!-- Video 2 -->
                <div class="video-card">
                    <div class="video-wrapper">
                        <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="Video 2" allowfullscreen></iframe>
                    </div>
                    <div class="video-info">
                        <h3>Arduino ile Proje Yapımı</h3>
                        <p>Robotik Dünyası • 850 görüntüleme</p>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script>
        // Sayfa yüklendiğinde hafızayı kontrol et
        window.onload = function() {
            if (localStorage.getItem('isVerified') === 'true') {
                showPlatform();
            }
        };

        // T.C. Kimlik Numarası Matematiksel Algoritma Kontrolü
        function validateTCKN(tc) {
            if (tc.length !== 11 || tc[0] === '0' || isNaN(tc)) return false;
            
            let digits = tc.split('').map(Number);
            let sumOdd = digits[0] + digits[2] + digits[4] + digits[6] + digits[8];
            let sumEven = digits[1] + digits[3] + digits[5] + digits[7];
            
            let d10 = ((sumOdd * 7) - sumEven) % 10;
            if (d10 < 0) d10 += 10;
            
            let d11 = (digits.slice(0, 10).reduce((a, b) => a + b, 0)) % 10;
            
            return digits[9] === d10 && digits[10] === d11;
        }

        function verifyUser() {
            const tc = document.getElementById('tcNo').value.trim();
            const birthYearInput = document.getElementById('birthYear').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.textContent = "";

            if (!tc || !birthYearInput) {
                errorMsg.textContent = "Lütfen tüm alanları doldurun!";
                return;
            }

            if (!validateTCKN(tc)) {
                errorMsg.textContent = "Hata: Geçersiz T.C. Kimlik Numarası!";
                return;
            }

            const birthYear = parseInt(birthYearInput);
            const currentYear = new Date().getFullYear();
            const age = currentYear - birthYear;

            if (age >= 0 && age < 15) {
                localStorage.setItem('isVerified', 'true');
                showPlatform();
            } else if (age >= 15) {
                errorMsg.textContent = "Erişim Reddedildi: Platform yalnızca 15 yaş altı içindir.";
            } else {
                errorMsg.textContent = "Lütfen geçerli bir doğum yılı girin.";
            }
        }

        function showPlatform() {
            document.getElementById('authGate').style.display = 'none';
            document.getElementById('videoPlatform').style.display = 'block';
        }

        function logout() {
            localStorage.removeItem('isVerified');
            location.reload(); // Sayfayı yenileyerek başa dön
        }
    </script>
</body>
</html>
